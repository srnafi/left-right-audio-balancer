name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        run: msbuild LeftRightAudioBalancer.sln /p:Configuration=Release /p:Platform=x64

      - name: Stage exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish
          Copy-Item bin/LeftRightAudioBalancer.exe publish/

      # Run the real exe and verify the startup shortcut smoke test
      - name: Smoke test the published exe
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'shortcut.txt'
          $exe = Join-Path $PWD 'publish/LeftRightAudioBalancer.exe'

          $process = Start-Process -FilePath $exe -ArgumentList '--shortcut-check', $report -Wait -PassThru
          Write-Host "exit code: $($process.ExitCode)"

          if (-not (Test-Path $report)) {
            throw 'The smoke test produced no report.'
          }

          Get-Content $report

          if (-not (Select-String -Path $report -Pattern 'verdict\s+PASS' -Quiet)) {
            throw 'The published exe could not resolve its own path.'
          }

          Write-Host 'Smoke test passed.'
