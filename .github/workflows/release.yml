name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, for example v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.event.inputs.tag }}'
          if (-not $tag) { $tag = '${{ github.ref_name }}' }
          $version = $tag.TrimStart('v')

          "tag=$tag"         >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing $tag as $version"

      - name: Build Release
        run: msbuild LeftRightAudioBalancer.sln /p:Configuration=Release /p:Platform=x64

      - name: Stage exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish
          Copy-Item src/LeftRightAudioBalancer/bin/LeftRightAudioBalancer.exe publish/

      - name: Verify the exe runs
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'shortcut.txt'
          $exe = Join-Path $PWD 'publish/LeftRightAudioBalancer.exe'

          $process = Start-Process -FilePath $exe -ArgumentList '--shortcut-check', $report -Wait -PassThru
          Write-Host "exit code: $($process.ExitCode)"

          if (-not (Test-Path $report)) {
            throw 'The smoke test produced no report.'
          }

          Get-Content $report

          if (-not (Select-String -Path $report -Pattern 'verdict\s+PASS' -Quiet)) {
            throw 'The published exe failed its smoke test.'
          }

      - name: Checksum
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'publish/LeftRightAudioBalancer.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()

          # LF, not CRLF. sha256sum -c on Linux, macOS and WSL treats a trailing
          # CR as part of the filename and fails with "No such file".
          $line = "$hash  LeftRightAudioBalancer.exe`n"
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'publish/LeftRightAudioBalancer.exe.sha256'),
            $line,
            [System.Text.Encoding]::ASCII)

          Get-Content publish/LeftRightAudioBalancer.exe.sha256

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'

          $fallback = @(
            'Left and right volume for one Windows output device.'
            ''
            'Download `LeftRightAudioBalancer.exe` and run it. Native Win32 / Direct2D fluent UI: no runtime to install.'
            ''
            'The exe is unsigned, so Windows may warn on first run. Verify the SHA256 above if you want to check the download.'
          ) -join "`n"

          $notesFile = "docs/release-notes/$tag.md"

          if (Test-Path $notesFile) {
            Write-Host "Using release notes from $notesFile"
            $body = Get-Content $notesFile -Raw
          }
          else {
            Write-Host "No notes file for $tag, using the default body"
            $body = $fallback
          }

          gh release create $tag `
            --title "Left Right Audio Balancer $tag" `
            --notes $body `
            publish/LeftRightAudioBalancer.exe `
            publish/LeftRightAudioBalancer.exe.sha256
